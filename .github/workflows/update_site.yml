name: Update generated site

permissions:
  contents: write
  pages: write
  id-token: write

on:
  repository_dispatch: {}
  workflow_dispatch:
    inputs:
      action:
        description: 'Which action/command to run'
        required: true
        default: 'all'

concurrency:
  group: generated-site-update
  cancel-in-progress: false

jobs:
  update_site:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', 'skip-ci') }}
    env:
      ACTION: ${{ github.event.action || github.event.inputs.action }}
      EXAMPLES_REF: ${{ github.event.client_payload.examples_sha || '' }}
      EXAMPLES_RUN_ID: ${{ github.event.client_payload.examples_run_id || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: master
          fetch-depth: 0

      - name: Refresh checkout
        run: |
          git fetch origin master
          git checkout master
          git reset --hard origin/master

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.3.13'
          bundler-cache: true
      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10.22'
          architecture: x64

      - name: Install Java
        if: env.ACTION == 'codepad' || env.ACTION == 'all'
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install Python dependencies
        run: python -m pip install --user requests pyyaml Pillow markdown==3.4.1 pygments==2.13.0

      - name: Show action and event
        run: 'echo "Event: ${{ github.event_name }} Action: ${{ env.ACTION }}"'

      - if: env.ACTION == 'asset-portal'
        name: Update assets
        run: python update.py --download asset-portal

      - if: env.ACTION == 'games-showcase'
        name: Update games
        run: python update.py --download games-showcase

      - if: env.ACTION == 'docs'
        name: Update docs
        run: python update.py --download docs

      - if: env.ACTION == 'refdoc'
        name: Update refdoc
        run: python update.py --download refdoc

      - name: Download built example bundles
        if: env.ACTION == 'examples' || env.ACTION == 'all'
        env:
          GH_TOKEN: ${{ secrets.SERVICES_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="$EXAMPLES_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --repo defold/examples --workflow trigger-site-rebuild.yml --branch master --status success --limit 50 --json databaseId --jq '.[].databaseId' | while read -r candidate; do
              if gh api "repos/defold/examples/actions/runs/$candidate/artifacts" --jq '.artifacts[] | select(.name == "examples-bundles" and .expired == false) | .id' | grep -q .; then echo "$candidate"; break; fi
            done)
          fi
          test -n "$run_id"
          gh run download "$run_id" --repo defold/examples --name examples-bundles --dir .
          snapshot_sha=$(python -c 'import json, zipfile; print(json.loads(zipfile.ZipFile("examples-bundles.zip").read("manifest.json"))["examples_sha"])')
          if [ -n "$EXAMPLES_REF" ] && [ "$EXAMPLES_REF" != "$snapshot_sha" ]; then
            echo "Snapshot SHA does not match the dispatch" >&2; exit 1
          fi
          if [ -f _data/examples_build.json ]; then
            previous_sha=$(python -c 'import json; print(json.load(open("_data/examples_build.json"))["examples_sha"])')
            status=$(gh api "repos/defold/examples/compare/$previous_sha...$snapshot_sha" --jq .status)
            if [ "$status" != ahead ] && [ "$status" != identical ]; then
              echo "Refusing to publish an older or divergent examples snapshot" >&2; exit 1
            fi
          fi

      - if: env.ACTION == 'examples'
        name: Update examples
        run: python update.py --download --examples-ref "$EXAMPLES_REF" examples

      - if: env.ACTION == 'codepad'
        name: Update codepad
        run: python update.py --download codepad

      - if: env.ACTION == 'all'
        name: Update everything
        run: python update.py --download all

      - if: startsWith(env.ACTION, 'extension-')
        name: Update extension
        run: python update.py --download --extension "$ACTION" extensions refdoc

      - name: Build Jekyll site
        run: |
          python -m scripts.strip_asmjs
          bundle exec jekyll build

      - name: Install Pagefind Python
        run: python -m pip install "pagefind[extended]==1.5.2"

      - name: Index site with Pagefind
        run: python3 -m pagefind

      - name: Commit generated site
        run: python update.py commit

      - if: github.ref == 'refs/heads/master'
        name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

      - if: github.ref == 'refs/heads/master'
        name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
